<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prachy</title>
<meta name="description" content="Prachy – zapiš útratu dvěma ťuknutími a sleduj, kam ti mizí peníze.">
<meta name="theme-color" content="#F4F1F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140F1B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prachy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1F8; --surface:#FFFFFF; --sunk:#ECE6F3; --ink:#1C1426; --muted:#6E6380; --line:#E2DBEB;
  --plum:#5B2A86; --plum-soft:#EADFF5; --on-plum:#FFFFFF; --gold:#E3A82B; --gold-soft:#FBEFD2;
  --up:#B4541F; --down:#2F7D4F;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --text:"Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar:68px;--top:58px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140F1B; --surface:#1E1728; --sunk:#271F33; --ink:#F2EDF8; --muted:#A699B6; --line:#2F263C;
    --plum:#B88BEA; --plum-soft:#33264A; --on-plum:#140F1B; --gold:#F2C14E; --gold-soft:#3A2F17;
    --up:#F0955F; --down:#6FCB93; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140F1B; --surface:#1E1728; --sunk:#271F33; --ink:#F2EDF8; --muted:#A699B6; --line:#2F263C;
  --plum:#B88BEA; --plum-soft:#33264A; --on-plum:#140F1B; --gold:#F2C14E; --gold-soft:#3A2F17;
  --up:#F0955F; --down:#6FCB93; color-scheme:dark;
}
html{height:100%;overscroll-behavior:none;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;touch-action:manipulation;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--plum);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- Přihlášení ---------- */
.auth{max-width:420px;margin:0 auto;padding:10vh 22px 40px}
.coin{width:64px;height:64px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:#1C1426;box-shadow:inset 0 0 0 5px color-mix(in srgb,#000 10%,var(--gold))}
.auth h1{font-family:var(--display);font-weight:800;font-size:clamp(48px,15vw,64px);letter-spacing:-0.04em;line-height:1;margin:22px 0 12px}
.auth .lead{color:var(--muted);margin:0 0 30px;font-size:17px;max-width:32ch}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;font-size:16px}
.field input:focus{border-color:var(--plum);outline:none}
.btn{width:100%;border-radius:16px;padding:16px;background:var(--plum);color:var(--on-plum);font-weight:600;font-size:17px;margin-top:6px}
.btn[disabled]{opacity:.6}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.link{color:var(--plum);font-weight:600;padding:8px 0;font-size:15px}
.auth-links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:12px}
.msg{margin:16px 0 0;padding:13px 15px;border-radius:14px;background:var(--plum-soft);font-size:15px}
.msg.err{background:color-mix(in srgb,var(--up) 14%,var(--surface));color:var(--up)}

/* ---------- Kostra aplikace ---------- */
body.lock{position:fixed;inset:0;overflow:hidden;width:100%}

.app{max-width:480px;margin:0 auto;padding:0 18px calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 20px)}
.topbar{display:flex;align-items:center;justify-content:space-between;height:var(--top)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-0.03em}
.logo .coin{width:26px;height:26px;font-size:9px;box-shadow:inset 0 0 0 2.5px color-mix(in srgb,#000 10%,var(--gold))}
.top-right{display:flex;align-items:center;gap:10px}
.sync{font-size:13px;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--plum-soft);color:var(--plum);font-weight:700;font-size:15px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;height:var(--tabbar)}
.tabbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbtn svg{width:24px;height:24px}
.tabbtn .pill{display:grid;place-items:center;width:56px;height:30px;border-radius:15px;transition:background .2s}
.tabbtn[aria-selected="true"]{color:var(--ink)}
.tabbtn[aria-selected="true"] .pill{background:var(--plum-soft);color:var(--plum)}

/* ---------- Zapsat ---------- */
.write{display:flex;flex-direction:column;overflow:hidden;
  height:calc(100vh - var(--tabbar) - var(--top) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  height:calc(100dvh - var(--tabbar) - var(--top) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.write .pad,.write .cats,.write .amount{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.display{padding:clamp(4px,2.2vh,18px) 0 0;text-align:center;flex:none}
.amount{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:800;letter-spacing:-0.045em;line-height:1;height:clamp(60px,11vh,90px);overflow:hidden;white-space:nowrap}
.amount #amtNum{font-size:min(19vw,9vh,80px)}
.amount.empty #amtNum{color:var(--line)}
.amount .kc{flex:none;font-size:24px;color:var(--muted);letter-spacing:-0.02em}
.meta{display:flex;justify-content:center;gap:8px;margin-top:clamp(6px,1.6vh,16px);flex-wrap:nowrap;height:36px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink)}
.chip svg{width:16px;height:16px;color:var(--muted)}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;cursor:pointer}
.note-input{height:36px;border-radius:18px;border:1.5px solid var(--plum);background:var(--surface);padding:0 14px;font-size:14px;width:min(260px,70vw);outline:none}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:clamp(6px,1.6vh,14px) 0 clamp(4px,1.2vh,10px);height:20px;flex:none;white-space:nowrap;overflow:hidden}

.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;flex:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0 4px;border-radius:14px;font-size:11.5px;font-weight:600;color:var(--ink);transition:opacity .15s,transform .1s}
.cat .bub{width:clamp(38px,6vh,48px);height:clamp(38px,6vh,48px);border-radius:50%;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 18%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 30%,transparent)}
.cat:active{transform:scale(.92)}
.cats.idle .cat:not(.add){opacity:.42}
.cat.add .bub{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);font-size:20px}
.cat .lab{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}

.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:4px;flex:1 1 auto;min-height:0;max-height:280px;margin-top:auto;padding:clamp(6px,1.5vh,14px) 0 6px}
.key{height:100%;min-height:0;border-radius:16px;touch-action:manipulation;font-family:var(--display);font-weight:500;font-size:24px;display:grid;place-items:center;transition:background .12s}
.key:active{background:var(--sunk)}
.key svg{width:26px;height:26px}

/* Výdaj / Příjem */
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 14px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,12,30,.10)}
.seg button.inc[aria-pressed="true"]{color:var(--down)}
body.on-write .logo .word{display:none}
.amount.income #amtNum{color:var(--down)}
.amount.income #amtNum::before{content:"+";margin-right:.04em}
.amount.income.empty #amtNum{color:var(--line)}
.amount.income.empty #amtNum::before{content:""}
.income-box{flex:none;display:flex;flex-direction:column;align-items:stretch;justify-content:center;padding:4px 2px}
.btn.inc{background:var(--down);color:var(--bg);margin:0;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.inc[disabled]{opacity:.35}
.btn.inc .ico{font-size:20px}

/* ---------- Přehled ---------- */
.banner{margin:10px 0 0;background:var(--gold-soft);border-radius:18px;padding:16px}
.banner p{margin:0 0 12px;font-size:15px}
.banner .btn{margin:0;padding:12px;font-size:15px;background:var(--ink);color:var(--bg)}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.monthnav h2{margin:0;font-size:17px;font-weight:600;text-transform:capitalize}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.round svg{width:18px;height:18px}
.round[disabled]{opacity:.3;cursor:default}
.hero{padding:18px 0 22px}
.hero .label{color:var(--muted);font-size:15px}
.hero .total{font-family:var(--display);font-weight:800;font-size:clamp(40px,13vw,58px);letter-spacing:-0.045em;line-height:1.05;margin:6px 0 12px}
.hero .total small{font-size:.42em;color:var(--muted);letter-spacing:-0.02em;margin-left:6px}
.cmp{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;padding:6px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.cmp b{font-weight:700}
.cmp.up b{color:var(--up)} .cmp.down b{color:var(--down)}
.total.pos{color:var(--down)} .total.neg{color:var(--up)}
.flows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.flow{background:var(--surface);border-radius:18px;padding:12px 14px}
.flow .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.flow .k i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.flow .v{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-0.03em;margin-top:4px}
.nudge{font-size:14px;color:var(--muted);margin:12px 2px 0}
.sect .sub-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.sect .sub-h h3{margin:0}
.trend .pair{display:flex;align-items:flex-end;justify-content:center;gap:3px;width:100%;flex:1;min-height:0}
.trend .pair .bar{max-width:16px;flex:1}
.trend .bar.i{background:color-mix(in srgb,var(--down) 35%,var(--sunk))}
.trend .bar.e{background:color-mix(in srgb,var(--plum) 35%,var(--sunk))}
.trend .col.on .bar.i{background:var(--down)}
.trend .col.on .bar.e{background:var(--plum)}
.trend .amt.pos{color:var(--down)} .trend .amt.neg{color:var(--up)}
.legend2{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:10px;padding-left:4px}
.legend2 span{display:flex;align-items:center;gap:6px}
.legend2 i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.tx-row .a.inc{color:var(--down)}

.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin-bottom:18px}
.stack span{display:block;background:var(--c);min-width:3px}
.breakdown{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.breakdown li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center}
.breakdown .bub{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.breakdown .nm{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.breakdown .nm span{color:var(--muted);font-weight:500;font-size:13px}
.breakdown .track{height:6px;border-radius:3px;background:var(--sunk);margin-top:6px;overflow:hidden}
.breakdown .track i{display:block;height:100%;border-radius:3px;background:var(--c)}
.breakdown .v{font-weight:700;font-size:15px;text-align:right}

.sect{margin-top:34px}
.sect h3{font-size:17px;font-weight:600;margin:0 0 14px}
.trend{display:flex;align-items:flex-end;gap:10px;height:160px;background:var(--surface);border-radius:22px;padding:16px 14px 12px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.trend .bar{width:100%;max-width:38px;border-radius:10px;background:var(--sunk);min-height:4px;transition:height .3s}
.trend .col.on .bar{background:var(--plum)}
.trend .lbl{font-size:12px;color:var(--muted)}
.trend .col.on .lbl{color:var(--ink);font-weight:700}
.trend .amt{font-size:10.5px;color:var(--muted);white-space:nowrap}
.trend .col.on .amt{color:var(--ink);font-weight:600}

.day{margin-bottom:18px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;padding:0 4px 8px}
.day-h span:first-child::first-letter{text-transform:uppercase}
.tx{background:var(--surface);border-radius:20px;padding:4px 6px}
.tx-row{display:grid;grid-template-columns:40px 1fr auto 30px;gap:12px;align-items:center;padding:10px 6px}
.tx-row + .tx-row{border-top:1px solid var(--line)}
.tx-row .bub{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.tx-row .t{font-weight:600;font-size:15px}
.tx-row .n{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-row .a{font-weight:700;font-size:15px}
.tx-row .del{width:30px;height:30px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
@media (max-height:660px){:root{--top:48px;--tabbar:60px}.logo{font-size:18px}.avatar{width:34px;height:34px}
  .hint{display:none}.tabbtn{font-size:11px}.tabbtn .pill{height:26px}
  .cat .lab{font-size:10.5px}.cat{gap:3px;padding:2px 0}.key{font-size:21px}.meta{height:32px}.chip{height:32px}}
.tx-row .del svg{width:15px;height:15px}
.tx-row .del:hover{background:var(--sunk);color:var(--up)}
.more-btn{display:block;margin:6px auto 0;color:var(--plum);font-weight:600;padding:10px}
.empty{color:var(--muted);text-align:center;padding:36px 10px;background:var(--surface);border-radius:22px}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* ---------- Spodní panel a toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,12,30,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 18px}
.sheet .who{font-size:14px;color:var(--muted);margin-bottom:4px}
.sheet .mail{font-weight:700;font-size:17px;margin-bottom:18px;word-break:break-all}
.sheet .btn{margin-top:8px}
.sheet .note{font-size:13px;color:var(--muted);margin:14px 0 0}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;width:max-content;bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 11px 11px 16px;border-radius:16px;display:flex;gap:14px;align-items:center;font-size:15px;transition:transform .22s ease,opacity .22s;max-width:calc(100% - 28px);z-index:10;box-shadow:0 10px 30px rgba(20,12,30,.25)}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);border-radius:10px;padding:6px 11px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ===== Přihlášení ===== -->
<section class="auth" id="authView" hidden>
  <div class="coin" aria-hidden="true">Kč</div>
  <h1>Prachy</h1>
  <p class="lead">Zapiš útratu dvěma ťuknutími a na konci měsíce uvidíš, kam ti peníze odešly.</p>
  <form id="authForm" novalidate>
    <label class="field"><span>E-mail</span><input id="email" type="email" autocomplete="email" required></label>
    <label class="field" id="passField"><span>Heslo</span><input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
    <button class="btn" id="authBtn" type="submit">Přihlásit se</button>
  </form>
  <div class="auth-links">
    <button class="link" id="toggleMode" type="button">Nemám účet – vytvořit</button>
    <button class="link" id="forgot" type="button">Zapomenuté heslo</button>
  </div>
  <p class="msg" id="authMsg" hidden></p>
</section>

<!-- ===== Aplikace ===== -->
<div id="appView" hidden>
  <div class="app">
    <header class="topbar">
      <div class="logo"><span class="coin" aria-hidden="true">Kč</span><span class="word">Prachy</span></div>
      <div class="seg" id="seg" role="group" aria-label="Typ záznamu"><button type="button" id="segExp" aria-pressed="true">Výdaj</button><button type="button" class="inc" id="segInc" aria-pressed="false">Příjem</button></div>
      <div class="top-right"><span class="sync" id="sync"></span><button class="avatar" id="menuBtn" aria-label="Účet a záloha">?</button></div>
    </header>

    <!-- Zapsat -->
    <section class="write" id="tabWrite" role="tabpanel" aria-label="Zapsat">
      <div class="display">
        <div class="amount empty" id="amount" aria-live="polite"><span id="amtNum" class="num">0</span><span class="kc">Kč</span></div>
        <div class="meta">
          <button class="chip" id="noteChip" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="noteLabel">Poznámka</span></button>
          <input class="note-input" id="note" maxlength="80" placeholder="Za co to bylo?" hidden>
          <label class="chip" id="dateChip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span id="dateLabel">Dnes</span><input type="date" id="date" aria-label="Datum útraty"></label>
        </div>
      </div>
      <p class="hint" id="hint"></p>
      <div class="cats idle" id="cats"></div>
      <div class="income-box" id="incomeBox" hidden><button class="btn inc" id="incomeBtn" type="button" disabled><span class="ico">💰</span>Přidat příjem</button></div>
      <div class="pad" id="pad" aria-label="Číselná klávesnice"></div>
    </section>

    <!-- Přehled -->
    <section id="tabStats" role="tabpanel" aria-label="Přehled" hidden>

function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function dayKey(d){return monthKey(d)+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return dayKey(new Date())}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dayKey(d)}
function shiftMonth(key,delta){const [y,m]=key.split("-").map(Number);return monthKey(new Date(y,m-1+delta,1))}
function monthName(key,short){const [y,m]=key.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("cs-CZ",short?{month:"short"}:{month:"long",year:"numeric"})}
function monthLocative(key){const [y,m]=key.split("-").map(Number);return ["v lednu","v únoru","v březnu","v dubnu","v květnu","v červnu","v červenci","v srpnu","v září","v říjnu","v listopadu","v prosinci"][m-1]}
function dayLabel(ds){
  if(ds===today())return "Dnes";
  if(ds===yesterday())return "Včera";
  const [y,m,d]=ds.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"numeric"});
}
function shortDate(ds){if(ds===today())return "Dnes";if(ds===yesterday())return "Včera";const [y,m,d]=ds.split("-").map(Number);return d+". "+m+"."+(y!==new Date().getFullYear()?" "+y:"")}
function allCats(){return BASE_CATS.concat(customCats)}

function parseAmount(){const v=parseFloat(amt.replace(",","."));return isFinite(v)&&v>0&&v<1e9?Math.round(v*100)/100:null}
function newId(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}

function validExpense(e){return e&&typeof e.id==="string"&&e.id.length<=64&&typeof e.amount==="number"&&e.amount>0&&typeof e.cat==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)}

/* ---------- Data & synchronizace ---------- */
const kPending=()=> "prachy-pending-"+user.id;
const kCache=()=> "prachy-cache-"+user.id;
function savePending(){lsSet(kPending(),pending);updateSync()}
function saveCache(){lsSet(kCache(),{expenses,custom:customCats})}
function updateSync(){
  const n=pending.length;
  $("sync").textContent=n?("Čeká na odeslání: "+n):(navigator.onLine?"":"Offline");
}
function applyPending(list){
  let out=list.slice();
  pending.forEach(op=>{
    if(op.type==="add"){if(!out.some(e=>e.id===op.row.id))out.push(op.row)}
    else out=out.filter(e=>e.id!==op.id);
  });
  return out;
}
async function loadAll(){
  let all=[],from=0;
  while(true){
    const {data,error}=await sb.from("expenses").select("id,amount,cat,note,date,ts").order("ts",{ascending:false}).range(from,from+999);
    if(error)throw error;
    all=all.concat(data);
    if(data.length<1000)break;
    from+=1000;
  }
  const {data:c,error:ce}=await sb.from("categories").select("custom").maybeSingle();
  if(ce)throw ce;
  return {expenses:all.map(r=>({id:r.id,amount:Number(r.amount),cat:r.cat,note:r.note||"",date:r.date,ts:Number(r.ts)})),custom:(c&&c.custom)||[]};
}
async function flush(){
  if(flushing||!pending.length||!navigator.onLine)return;
  flushing=true;
  try{
    while(pending.length){
      const op=pending[0];
      if(op.type==="add"){
        let n=0;while(n<pending.length&&n<500&&pending[n].type==="add")n++;
        const rows=pending.slice(0,n).map(o=>({user_id:user.id,id:o.row.id,amount:o.row.amount,cat:o.row.cat,note:o.row.note||"",date:o.row.date,ts:o.row.ts}));
        const {error}=await sb.from("expenses").upsert(rows,{onConflict:"user_id,id"});
        if(error)throw error;
        pending.splice(0,n);
      }else{
        const {error}=await sb.from("expenses").delete().eq("id",op.id);
        if(error)throw error;
        pending.shift();
      }
      savePending();
    }
  }catch(e){console.warn("Synchronizace selhala",e)}
  finally{flushing=false;updateSync()}
}
async function refresh(){
  await flush();
  try{
    const d=await loadAll();
    expenses=applyPending(d.expenses);customCats=d.custom;saveCache();render();renderCats();
  }catch(e){console.warn("Načtení selhalo",e);updateSync()}
}
function addLocal(e){
  expenses.push(e);pending.push({type:"add",row:e});savePending();saveCache();render();flush();
}
function removeLocal(id){
  const i=pending.findIndex(o=>o.type==="add"&&o.row.id===id);
  if(i>=0)pending.splice(i,1);else pending.push({type:"del",id});
  expenses=expenses.filter(e=>e.id!==id);savePending();saveCache();render();flush();
}
async function saveCustom(list){
  customCats=list;saveCache();renderCats();render();
  const {error}=await sb.from("categories").upsert({user_id:user.id,custom:list});
  if(error)toast("Kategorie se uloží, až budeš online.",false);
}
function importList(list,custom){
  const have=new Set(expenses.map(e=>e.id));
  const add=list.filter(e=>validExpense(e)&&!have.has(e.id)).map(e=>({id:e.id,amount:Math.round(e.amount*100)/100,cat:e.cat,note:String(e.note||"").slice(0,200),date:e.date,ts:Number(e.ts)||Date.now()}));
  add.forEach(e=>{expenses.push(e);pending.push({type:"add",row:e})});
  const cids=new Set(customCats.map(c=>c.id));
  const newCats=(custom||[]).filter(c=>c&&c.id&&c.name&&!cids.has(c.id));
  savePending();saveCache();render();flush();
  if(newCats.length)saveCustom(customCats.concat(newCats));
  return add.length;
}

function buildPad(){
  const keys=["1","2","3","4","5","6","7","8","9",",","0","del"];

  keys.forEach(k=>{

    b.onclick=()=>press(k);pad.appendChild(b);
  });
}
function press(k){
  if(k==="del"){amt=amt.slice(0,-1)}
  else if(k===","){if(!amt.includes(","))amt=(amt||"0")+","}
  else{
    const [i,d]=amt.split(",");
    if(d!==undefined){if(d.length>=2)return;amt+=k}
    else{if(i.length>=7)return;amt=(amt==="0")?k:amt+k}
  }
  updateAmount();
}
function fitAmount(){
  const el=$("amount"),n=$("amtNum");
  n.style.fontSize="";
  const avail=el.clientWidth-4;
  if(el.scrollWidth>avail){const base=parseFloat(getComputedStyle(n).fontSize);n.style.fontSize=Math.max(22,Math.floor(base*avail/el.scrollWidth*0.97))+"px"}
}
window.addEventListener("resize",fitAmount);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAmount);
function updateAmount(){
  const el=$("amount");
  let [i,d]=amt.split(",");
  const shown=amt?((i||"0").replace(/\B(?=(\d{3})+(?!\d))/g,"\u202F")+(d!==undefined?","+d:"")):"0";
  $("amtNum").textContent=shown;
  el.classList.toggle("empty",!amt);

let lastAdded=null,toastTimer=null;
function addExpense(catId){
  const amount=parseAmount();
  if(amount===null){$("hint").textContent="Nejdřív zadej částku na klávesnici";return}
  const date=$("date").value||today();
  const e={id:newId(),amount,cat:catId,note:$("note").value.trim(),date,ts:Date.now()};
  addLocal(e);lastAdded=e.id;
  amt="";$("note").value="";$("noteLabel").textContent="Poznámka";$("date").value=today();$("dateLabel").textContent="Dnes";
  viewMonth=date.slice(0,7);showAll=false;updateAmount();

  if(catId==="prijem"){toast("Přidán příjem +"+fmt(amount),true);setKind("exp")}
  else toast("Uloženo "+fmt(amount)+" – "+catById(catId).name,true);
}

  $("toastMsg").textContent=msg;$("undo").style.display=undo?"":"none";

  const ico=(prompt("Emoji pro kategorii (nepovinné):","🏷️")||"🏷️").trim().slice(0,4);
  saveCustom(customCats.concat([{id:"c"+Date.now().toString(36),name:name.slice(0,20),ico,c:EXTRA_COLORS[customCats.length%EXTRA_COLORS.length]}]));

/* ---------- Přehled ---------- */
function sumBy(month){
  const m={};let total=0,count=0,income=0;
  expenses.forEach(e=>{if(e.date.slice(0,7)!==month)return;
    if(isInc(e)){income+=e.amount;return}
    m[e.cat]=(m[e.cat]||0)+e.amount;total+=e.amount;count++});
  return {m,total,count,income};
}
const signed=n=>(n>0?"+":n<0?"−":"")+fmt0(Math.abs(n));
const compact=n=>{const a=Math.abs(n),s=n>0?"+":n<0?"−":"";
  if(a>=10000)return s+Math.round(a/1000)+" tis.";
  if(a>=1000)return s+(a/1000).toFixed(1).replace(".",",")+" tis.";
  return s+Math.round(a)};
function render(){
  const cur=monthKey(new Date());
  $("monthTitle").textContent=monthName(viewMonth);
  $("next").disabled=viewMonth>=cur;
  const {m,total,income}=sumBy(viewMonth);
  const bal=income-total;
  const rows=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  const sum=$("summary");sum.innerHTML="";

  // Bilance
  const hero=document.createElement("div");hero.className="hero";
  const isCur=viewMonth===cur;
  const label=bal>0?(isCur?"Tento měsíc jsi v plusu":"Měsíc skončil v plusu"):bal<0?(isCur?"Tento měsíc jsi v minusu":"Měsíc skončil v minusu"):"Bilance měsíce";
  hero.innerHTML=`<div class="label">${label}</div><div class="total num ${bal>0?"pos":bal<0?"neg":""}">${signed(bal)}<small>Kč</small></div>
    <div class="flows">
      <div class="flow" style="--c:var(--down)"><div class="k"><i></i>Příjmy</div><div class="v num">${fmt0(income)} Kč</div></div>
      <div class="flow" style="--c:var(--plum)"><div class="k"><i></i>Výdaje</div><div class="v num">${fmt0(total)} Kč</div></div>
    </div>${income===0?'<p class="nudge">Příjem přidáš v záložce Zapsat přepnutím nahoře na „Příjem“.</p>':""}`;
  sum.appendChild(hero);

  // Výdaje podle kategorií
  if(rows.length){
    const sec=document.createElement("div");sec.className="sect";sec.style.marginTop="14px";
    const prev=sumBy(shiftMonth(viewMonth,-1)).total;
    let cmp="";
    if(prev>0&&total>0){
      const pct=Math.round((total-prev)/prev*100);
      cmp=pct===0?`<span class="cmp">Stejně jako ${monthLocative(shiftMonth(viewMonth,-1))}</span>`
        :`<span class="cmp ${pct>0?"up":"down"}"><b>${pct>0?"↑":"↓"} ${Math.abs(pct)} %</b> oproti ${monthLocative(shiftMonth(viewMonth,-1)).replace(/^v /,"")}</span>`;
    }
    sec.innerHTML=`<div class="sub-h"><h3>Výdaje podle kategorií</h3>${cmp}</div>`;
    const st=document.createElement("div");st.className="stack";
    rows.forEach(([id,v])=>{const sp=document.createElement("span");sp.style.setProperty("--c",catById(id).c);sp.style.flex=String(v);st.appendChild(sp)});
    sec.appendChild(st);
    const ul=document.createElement("ul");ul.className="breakdown";
    const top=rows[0][1];
    rows.forEach(([id,v])=>{const c=catById(id);const li=document.createElement("li");li.style.setProperty("--c",c.c);
      li.innerHTML=`<span class="bub"></span><div><div class="nm"><b></b><span>${Math.round(v/total*100)} %</span></div><div class="track"><i style="width:${(v/top*100).toFixed(1)}%"></i></div></div><span class="v num">${fmt(v)}</span>`;
      li.querySelector(".bub").textContent=c.ico;li.querySelector("b").textContent=c.name;ul.appendChild(li)});
    sec.appendChild(ul);
    sum.appendChild(sec);
  }

  // 6 měsíců: příjmy vs výdaje
  const months=[];for(let i=5;i>=0;i--)months.push(shiftMonth(viewMonth>cur?cur:viewMonth,-i));
  const data=months.map(k=>sumBy(k));
  const max=Math.max(...data.map(d=>Math.max(d.total,d.income)),1);
  const tr=$("trend");tr.innerHTML="";
  months.forEach((k,i)=>{const d=data[i],b=d.income-d.total;const col=document.createElement("button");col.className="col"+(k===viewMonth?" on":"");
    col.setAttribute("aria-label",monthName(k)+": příjmy "+fmt(d.income)+", výdaje "+fmt(d.total));
    col.innerHTML=`<span class="amt num ${b>0?"pos":b<0?"neg":""}">${(d.income||d.total)?compact(b):""}</span><span class="pair"><span class="bar i" style="height:${Math.max(d.income/max*100,3)}%"></span><span class="bar e" style="height:${Math.max(d.total/max*100,3)}%"></span></span><span class="lbl">${monthName(k,true)}</span>`;
    col.onclick=()=>{viewMonth=k;showAll=false;render()};tr.appendChild(col)});

  // Seznam
  const items=expenses.filter(e=>e.date.slice(0,7)===viewMonth).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  const list=$("list");list.innerHTML="";
  if(!items.length){list.innerHTML='<div class="empty"><strong>Zatím prázdno</strong>V záložce Zapsat přidáš první útratu nebo příjem.</div>';return}
  const shown=showAll?items:items.slice(0,25);
  const days={};shown.forEach(e=>{(days[e.date]=days[e.date]||[]).push(e)});
  Object.keys(days).sort().reverse().forEach(ds=>{
    const dayItems=items.filter(e=>e.date===ds);
    const exp=dayItems.filter(e=>!isInc(e)).reduce((s,e)=>s+e.amount,0);
    const inc=dayItems.filter(isInc).reduce((s,e)=>s+e.amount,0);
    const head=inc?signed(inc-exp)+" Kč":fmt(exp);
    const wrap=document.createElement("div");wrap.className="day";
    wrap.innerHTML=`<div class="day-h"><span></span><span class="num"></span></div><div class="tx"></div>`;
    wrap.querySelector(".day-h span").textContent=dayLabel(ds);
    wrap.querySelector(".day-h .num").textContent=head;
    const tx=wrap.querySelector(".tx");
    days[ds].forEach(e=>{const c=catById(e.cat);const r=document.createElement("div");r.className="tx-row";r.style.setProperty("--c",c.c);
      r.innerHTML=`<span class="bub"></span><div style="min-width:0"><div class="t"></div><div class="n"></div></div><span class="a num"></span><button class="del" aria-label="Smazat">${ICON_X}</button>`;
      r.querySelector(".bub").textContent=c.ico;r.querySelector(".t").textContent=c.name;
      const n=r.querySelector(".n");if(e.note)n.textContent=e.note;else n.remove();
      const a=r.querySelector(".a");
      if(isInc(e)){a.textContent="+"+fmt(e.amount);a.classList.add("inc")}else a.textContent=fmt(e.amount);
      r.querySelector(".del").onclick=()=>{if(confirm("Smazat "+(isInc(e)?"příjem ":"")+fmt(e.amount)+(isInc(e)?"":" ("+c.name+")")+"?"))removeLocal(e.id)};
      tx.appendChild(r)});
    list.appendChild(wrap);
  });
  if(!showAll&&items.length>25){const b=document.createElement("button");b.className="more-btn";b.textContent="Zobrazit všech "+items.length;b.onclick=()=>{showAll=true;render()};list.appendChild(b)}
}
$("prev").onclick=()=>{viewMonth=shiftMonth(viewMonth,-1);showAll=false;render()};
$("next").onclick=()=>{viewMonth=shiftMonth(viewMonth,1);showAll=false;render()};

/* ---------- Účet, záloha a přenos starých dat ---------- */
$("menuBtn").onclick=()=>{$("scrim").hidden=false};
$("scrim").onclick=e=>{if(e.target===$("scrim"))$("scrim").hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("scrim").hidden=true});
$("exportBtn").onclick=()=>{
  const data=JSON.stringify({app:"prachy",version:2,exported:new Date().toISOString(),expenses,custom:customCats},null,1);
  const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download="prachy-zaloha-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.expenses))throw 0;
    $("scrim").hidden=true;toast("Nahráno "+importList(d.expenses,d.custom)+" nových záznamů.",false);
  }catch(e){toast("Tohle není platný soubor se zálohou.",false)}
};
function checkOldData(){
  const old=lsGet("utraty-v1",null);
  const n=old&&Array.isArray(old.expenses)?old.expenses.length:0;
  if(n&&!lsGet("prachy-migrated-"+user.id,false)){
    $("migrateText").textContent="V tomhle prohlížeči máš "+n+" útrat ze starší verze bez účtu. Chceš je přenést do svého účtu?";
    $("migrate").hidden=false;
    $("migrateBtn").onclick=()=>{const k=importList(old.expenses,old.custom);lsSet("prachy-migrated-"+user.id,true);$("migrate").hidden=true;toast("Přeneseno "+k+" útrat.",false)};
  }
}

/* ---------- Přihlášení ---------- */
let mode="login";
function setMode(m){
  mode=m;
  $("passField").hidden=(m==="reset");
  $("email").closest(".field").hidden=(m==="newpass");
  $("password").autocomplete=(m==="login")?"current-password":"new-password";
  $("authBtn").textContent={login:"Přihlásit se",signup:"Vytvořit účet",reset:"Poslat odkaz na nové heslo",newpass:"Uložit nové heslo"}[m];
  $("toggleMode").textContent=m==="login"?"Nemám účet – vytvořit":"Zpět na přihlášení";
  $("forgot").hidden=(m!=="login");
  $("passField").querySelector("span").textContent=m==="newpass"?"Nové heslo":(m==="signup"?"Heslo (aspoň 6 znaků)":"Heslo");
}
function authMsg(text,err){const el=$("authMsg");el.textContent=text;el.className="msg"+(err?" err":"");el.hidden=!text}
function czError(e){
  const m=(e&&e.message||"").toLowerCase();
  if(m.includes("invalid login"))return "Špatný e-mail nebo heslo.";
  if(m.includes("not confirmed"))return "Nejdřív potvrď e-mail – klikni na odkaz, který ti přišel.";
  if(m.includes("already registered")||m.includes("already been registered"))return "Tenhle e-mail už má účet. Přihlas se.";
  if(m.includes("password")&&m.includes("6"))return "Heslo musí mít aspoň 6 znaků.";
  if(m.includes("rate limit")||m.includes("too many"))return "Příliš mnoho pokusů. Zkus to za chvíli.";
  if(m.includes("fetch")||m.includes("network"))return "Nejde se připojit k internetu.";
  return "Něco se nepovedlo: "+(e&&e.message||"neznámá chyba");
}
$("toggleMode").onclick=()=>{setMode(mode==="login"?"signup":"login");authMsg("")};
$("forgot").onclick=()=>{setMode("reset");authMsg("")};
$("authForm").onsubmit=async ev=>{
  ev.preventDefault();
  const email=$("email").value.trim(),password=$("password").value;
  if(mode!=="newpass"&&!/^\S+@\S+\.\S+$/.test(email))return authMsg("Zadej platný e-mail.",true);
  if(mode!=="reset"&&password.length<6)return authMsg("Heslo musí mít aspoň 6 znaků.",true);
  $("authBtn").disabled=true;authMsg("");
  try{
    if(mode==="login"){
      const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;
    }else if(mode==="signup"){
      const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:APP_URL}});if(error)throw error;
      if(!data.session){setMode("login");authMsg("Hotovo! Poslali jsme ti e-mail. Klikni na odkaz v něm a pak se tu přihlas.")}
    }else if(mode==="reset"){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});if(error)throw error;
      setMode("login");authMsg("Pokud k e-mailu existuje účet, přišel ti odkaz na nastavení nového hesla.");
    }else if(mode==="newpass"){
      const {error}=await sb.auth.updateUser({password});if(error)throw error;
      authMsg("");setMode("login");startApp((await sb.auth.getUser()).data.user);
    }
  }catch(e){authMsg(czError(e),true)}
  finally{$("authBtn").disabled=false}
};
$("logout").onclick=async()=>{
  if(pending.length&&!confirm("Některé útraty se ještě neodeslaly a po odhlášení se ztratí. Opravdu odhlásit?"))return;
  $("scrim").hidden=true;await sb.auth.signOut();
};

function showAuth(){document.body.classList.remove("lock");user=null;$("appView").hidden=true;$("scrim").hidden=true;$("authView").hidden=false;setMode("login")}
function startApp(u){
  if(!u)return showAuth();
  if(user&&user.id===u.id&&!$("appView").hidden)return;
  user=u;$("authView").hidden=true;$("appView").hidden=false;
  $("who").textContent=u.email||"";
  $("menuBtn").textContent=(u.email||"?").charAt(0).toUpperCase();
  pending=lsGet(kPending(),[]);
  const c=lsGet(kCache(),{expenses:[],custom:[]});
  expenses=applyPending(c.expenses||[]);customCats=c.custom||[];
  $("date").value=today();$("dateLabel").textContent="Dnes";
  buildPad();updateSync();renderCats();setTab("write");checkOldData();refresh();
}

/* ---------- Start ---------- */
(async()=>{
  if(!window.supabase){
    $("authView").hidden=false;authMsg("Aplikaci se nepodařilo načíst. Zkontroluj připojení k internetu a obnov stránku.",true);
    $("authForm").hidden=true;return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange((event,session)=>{
    setTimeout(()=>{
      if(event==="PASSWORD_RECOVERY"){$("appView").hidden=true;$("authView").hidden=false;setMode("newpass");authMsg("Zadej nové heslo.");return}
      if(event==="SIGNED_OUT")return showAuth();
      if(session&&session.user&&mode!=="newpass")startApp(session.user);
    },0);
  });
  const {data}=await sb.auth.getSession();
  if(data.session&&mode!=="newpass")startApp(data.session.user);else if(!data.session)showAuth();
})();
window.addEventListener("online",()=>{if(user)refresh()});
window.addEventListener("offline",updateSync);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&user)refresh()});
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
